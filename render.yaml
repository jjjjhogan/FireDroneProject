services:
  - type: web
    name: firedrone-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT wsgi:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_DEBUG
        value: "false"
      - key: DRONE_CONNECTOR
        value: real
      - key: ALLOW_DJI_COMMANDS
        value: "false"
      - key: AUTH_REQUIRED
        value: "false"
      - key: DJI_INGEST_TOKEN
        sync: false
      - key: DJI_TELEMETRY_TTL_SECONDS
        value: "300"
      - key: GOOGLE_OAUTH_RUNTIME_CONFIG_ALLOWED
        value: "false"
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: GOOGLE_OAUTH_REDIRECT_URI
        value: https://firedrone-api.onrender.com/api/accounts/google/callback
      - key: FRONTEND_APP_URL
        value: https://firedrone-command.onrender.com/
      - key: MAP_DEFAULT_BASEMAP
        value: satellite
      - key: MAP_SEARCH_PROVIDER
        value: nominatim
      - key: NOMINATIM_USER_AGENT
        value: FireDroneProject/0.1 public-safety-prototype
      # Neon Postgres connection string (postgresql://...). When set, SQLite is not used.
      - key: DATABASE_URL
        sync: false

  - type: web
    name: firedrone-command
    runtime: static
    rootDir: flutter_app
    buildCommand: bash render-build.sh
    staticPublishPath: build/web
    envVars:
      - key: FLUTTER_VERSION
        value: 3.44.1
      - key: FIRE_DRONE_API_BASE
        value: https://firedrone-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # HTTP patrol demo: posts synthetic Cloud API telemetry to firedrone-api (no MQTT broker).
  # Set DJI_INGEST_TOKEN in Render to match firedrone-api. For real DJI MQTT, set
  # DJI_DEMO_INGEST=false and configure DJI_CLOUD_API_MQTT_* on this worker.
  - type: worker
    name: firedrone-cloud-relay
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/dji_render_relay_worker.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DJI_DEMO_INGEST
        value: "true"
      - key: FIRE_DRONE_API_BASE
        value: https://firedrone-api.onrender.com/api
      - key: DJI_INGEST_TOKEN
        sync: false
      - key: DJI_DEMO_DEVICE_ID
        value: demo-aircraft
      - key: DJI_DEMO_INTERVAL_SECONDS
        value: "45"
      - key: DJI_CLOUD_API_MQTT_HOST
        sync: false
      - key: DJI_CLOUD_MQTT_USERNAME
        sync: false
      - key: DJI_CLOUD_MQTT_PASSWORD
        sync: false
