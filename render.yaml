services:
  - type: web
    name: firedrone-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT wsgi:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_DEBUG
        value: "false"
      - key: DRONE_CONNECTOR
        value: mock
      - key: ALLOW_DJI_COMMANDS
        value: "false"
      - key: AUTH_REQUIRED
        value: "false"
      - key: GOOGLE_OAUTH_RUNTIME_CONFIG_ALLOWED
        value: "false"
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: GOOGLE_OAUTH_REDIRECT_URI
        value: https://firedrone-api.onrender.com/api/accounts/google/callback
      - key: FRONTEND_APP_URL
        value: https://firedrone-command.onrender.com/
      - key: MAP_DEFAULT_BASEMAP
        value: satellite
      - key: MAP_SEARCH_PROVIDER
        value: nominatim
      - key: NOMINATIM_USER_AGENT
        value: FireDroneProject/0.1 public-safety-prototype

  - type: web
    name: firedrone-command
    runtime: static
    rootDir: flutter_app
    buildCommand: bash render-build.sh
    staticPublishPath: build/web
    envVars:
      - key: FLUTTER_VERSION
        value: 3.44.1
      - key: FIRE_DRONE_API_BASE
        value: https://firedrone-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
